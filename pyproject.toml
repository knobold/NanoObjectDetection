[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoobjectdetection"
version = "2.0.0"
description = "Particle localization and diffusion analysis for TIFF image stacks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tim Stechel" },
    { name = "Ronny Förster" },
]
keywords = [
    "nanoparticles",
    "microscopy",
    "diffusion",
    "tracking",
    "stokes-einstein",
    "trackpy",
    "tiff",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "tifffile",
    "trackpy",
    "tqdm",
    "matplotlib",
    "numba",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]

[project.urls]
Homepage = "https://github.com/knobold/NanoObjectDetection"
Repository = "https://github.com/knobold/NanoObjectDetection"
Issues = "https://github.com/knobold/NanoObjectDetection/issues"

[project.scripts]
nanoobjectdetection = "nanoobjectdetection.application:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanoobjectdetection*"]
exclude = ["example*", "nanoobjectdetection_legacy*"]

